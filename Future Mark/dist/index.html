    <title>Future Mark — Paper Grading & Marking for Teachers</title>
    <script>
      try {
        const saved = localStorage.getItem("futuremark-theme") || localStorage.getItem("openmark-theme");
        if (saved === "dark" || saved === "light") {
          document.querySelector('meta[name="color-scheme"]').content = saved;
          if (saved === "dark") document.documentElement.classList.add("dark");
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
